<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Worm</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <div class="score-board">
                <span class="label">SCORE</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="lives-display">
                <span class="label">LIVES</span>
                <span id="lives" class="lives-hearts">❤️ ❤️ ❤️</span>
            </div>
            <h1 class="title">NEON WORM</h1>
            <div class="score-board">
                <span class="label">HIGH SCORE</span>
                <span id="high-score" class="value">0</span>
            </div>
        </header>

        <div class="canvas-wrapper">
            <canvas id="game-canvas" width="400" height="400"></canvas>
            
            <div id="overlay" class="overlay">
                <h2 id="overlay-title">NEON WORM</h2>
                <p id="overlay-text">Press Space to Start</p>
                <div class="controls-hint">
                    <p>Controls: Arrow Keys or W A S D</p>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
